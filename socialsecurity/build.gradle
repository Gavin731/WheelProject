plugins {
    id 'com.android.application'
}

android {
    namespace 'com.rzm.socialsecurity'
    compileSdk 34

    defaultConfig {
        applicationId "com.rzm.socialsecurity"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
        multiDexEnabled true

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    // 渠道配置
    flavorDimensions "channel"
    productFlavors {
        huawei {
            dimension "channel"
            // 华为渠道特有配置
            manifestPlaceholders = [CHANNEL_ID: "huawei"]
        }
        xiaomi {
            dimension "channel"
            manifestPlaceholders = [CHANNEL_ID: "xiaomi"]
        }
        oppo {
            dimension "channel"
            manifestPlaceholders = [CHANNEL_ID: "oppo"]
        }
        vivo {
            dimension "channel"
            manifestPlaceholders = [CHANNEL_ID: "vivo"]
        }
        lianxiang {
            dimension "channel"
            manifestPlaceholders = [CHANNEL_ID: "lianxiang"]
        }
    }

    buildFeatures {
        buildConfig true  // 启用 BuildConfig 生成功能
    }

    signingConfigs {
        release {
            storeFile file("/Users/zenglinggui/Documents/ad/juduo.jks")
            storePassword "juduo123"
            keyAlias "juduo"
            keyPassword "juduo123"
        }
        debug {
//            storeFile file("/Users/zenglinggui/Documents/ad/juduo.jks")
//            storePassword "juduo123"
//            keyAlias "juduo"
//            keyPassword "juduo123"
        }
    }

    buildTypes {
        debug {
            debuggable true
//            minifyEnabled true //开启混淆
//            shrinkResources false //移除无用资源
//            zipAlignEnabled false //zipalign优化
//            signingConfig signingConfigs.debug
//            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }

        release {
            minifyEnabled true //开启混淆
            shrinkResources false //移除无用资源
            zipAlignEnabled true //zipalign优化
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
            buildConfigField("boolean", "LOG_DEBUG", "false")//正式版不打印日志
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    packagingOptions {
        exclude 'AndroidManifest.xml' // 忽略 .aar 文件中的 AndroidManifest.xml
    }
}

dependencies {

    implementation fileTree(include: ['*.jar', '*.aar'], dir: 'libs')

    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.activity:activity:1.8.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation project(':base')
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'

    implementation 'com.blankj:utilcode:1.29.0'
    //glide
    api 'com.github.bumptech.glide:glide:4.8.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.8.0'
