plugins {
    id 'com.android.application'
}

android {
    namespace 'com.rzm.socialsecurity'
    compileSdk 34

    defaultConfig {
        applicationId "com.rzm.socialsecurity"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
        multiDexEnabled true

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildFeatures {
        buildConfig true  // 启用 BuildConfig 生成功能
    }

    signingConfigs {
        release {
//            storeFile file("/Users/zenglinggui/Documents/zeng/key_store/shangyantong.keystore")
//            storePassword "qcwl2syt"
//            keyAlias "syt"
//            keyPassword "qcwl2syt"
        }
        debug {
        }
    }

    buildTypes {
        debug {
            debuggable true
            signingConfig signingConfigs.debug
            buildConfigField("boolean", "LOG_DEBUG", "true")
        }

        release {
            minifyEnabled false //开启混淆
            shrinkResources false //移除无用资源
            zipAlignEnabled true //zipalign优化
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
            buildConfigField("boolean", "LOG_DEBUG", "false")//正式版不打印日志
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    packagingOptions {
        exclude 'AndroidManifest.xml' // 忽略 .aar 文件中的 AndroidManifest.xml
    }
}

dependencies {

    implementation fileTree(include: ['*.jar', '*.aar'], dir: 'libs')

    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.activity:activity:1.8.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation project(':base')
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'

    implementation 'com.blankj:utilcode:1.29.0'
    //glide
    api 'com.github.bumptech.glide:glide:4.8.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.8.0'
    //SharedPreferences
    implementation "com.orhanobut:hawk:2.0.1"
    //okhttp
    implementation "com.squareup.okhttp3:okhttp:4.7.2"
    //rxjava和retrofit
    implementation 'io.reactivex.rxjava3:rxjava:3.0.4'
    implementation 'io.reactivex.rxjava3:rxandroid:3.0.2'
    implementation 'com.squareup.retrofit2:retrofit:2.8.1'
    implementation 'com.squareup.retrofit2:converter-gson:2.8.1'
    implementation 'com.squareup.retrofit2:adapter-rxjava2:2.8.1'
    //添加HttpLoggingInterceptor
    implementation 'com.squareup.okhttp3:logging-interceptor:3.9.0'

    implementation "com.android.support:support-v4:28.0.0"

    //底部tab导航
    implementation 'me.majiajie:pager-bottom-tab-strip:2.4.0'
    //多dex
